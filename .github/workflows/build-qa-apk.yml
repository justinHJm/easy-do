name: Build QA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EASY_DO_QA: '1'
      EXPO_NO_GIT_STATUS: '1'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Confirm QA Expo configuration
        run: |
          npx expo config --type public --json > /tmp/easy-do-config.json
          node -e "const config = require('/tmp/easy-do-config.json'); if (config.android?.package !== 'com.justinhjm.easydo.qa' || config.name !== 'easy-do QA') process.exit(1);"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Confirm generated QA package and Widgets
        run: |
          grep -R -q 'com.justinhjm.easydo.qa' android/app
          grep -R -q 'TodoWidget' android/app/src/main
          grep -R -q 'AllTodoWidget' android/app/src/main
          grep -q 'signingConfig signingConfigs.debug' android/app/build.gradle

      - name: Build standalone QA APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Stage QA APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/easy-do-qa.apk

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: easy-do-qa-apk
          path: artifacts/easy-do-qa.apk
          if-no-files-found: error
          retention-days: 3
